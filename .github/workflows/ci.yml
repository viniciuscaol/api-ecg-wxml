name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ECG_API_KEY: ""
      ECG_CORS_ORIGINS: ""
    steps:
      - name: Baixar código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Conferir dependências instaladas
        run: python -m pip check
      - name: Executar testes
        run: python -m pytest -q

  docker:
    name: API em Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ECG_BIND_IP: "127.0.0.1"
      ECG_PORT: "8000"
      ECG_API_KEY: "chave-sintetica-exclusiva-do-ci"
      ECG_CORS_ORIGINS: ""
    steps:
      - name: Baixar código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Conferir configuração Compose
        run: docker compose config --quiet
      - name: Construir e iniciar API
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Testar API com exame sintético
        run: python3 scripts/smoke_api.py
      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose down --volumes --remove-orphans
